<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workshop Registration</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: #fff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    /* EDIT THIS TEXT ANYTIME IN YOUR HTML EDITOR */
    .workshop-title {
      text-align: center;
      margin: 0 0 10px;
      font-size: 30px;
      line-height: 1.2;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d6d9de;
      border-radius: 9px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #555;
    }

    .fee {
      margin: 22px 0;
      padding: 16px;
      border-radius: 10px;
      background: #f7f7f7;
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: 700;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 9px;
      padding: 15px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      background: #111;
      color: #fff;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      text-align: center;
      line-height: 1.5;
    }

    .success {
      display: block !important;
      background: #eaf8ee;
      color: #176b35;
    }

    .error {
      display: block !important;
      background: #fff0f0;
      color: #a32626;
    }

    .note {
      margin-top: 18px;
      text-align: center;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="container">

    <!--
      ======================================================
      EDIT WORKSHOP NAME HERE
      ======================================================
      Just replace the words between <h1> and </h1>.

      Example:
      <h1 class="workshop-title">AI Filmmaking Workshop</h1>

      You can change it anytime using any HTML editor.
    -->
    <h1 class="workshop-title">Workshop Registration</h1>

    <div class="subtitle">Register now and pay securely online.</div>

    <form id="registrationForm">

      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="Enter your full name" required>

      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="Enter your email" required>

      <label for="phone">Phone Number</label>
      <input
        type="tel"
        id="phone"
        placeholder="Enter your phone number"
        pattern="[0-9]{10}"
        maxlength="10"
        required
      >

      <div class="fee">
        <span>Registration Fee</span>
        <span>₹89</span>
      </div>

      <button type="submit" id="payButton">Pay ₹89 & Register</button>

      <div id="message"></div>

      <div class="note">Secure payment powered by Razorpay</div>
    </form>
  </div>

<script>
  /*
    ======================================================
    RAZORPAY SETTINGS
    ======================================================
  */

  const RAZORPAY_KEY_ID = "rzp_test_TjZKFsdB3NPG98";
  const REGISTRATION_FEE_PAISE = 8900;

  const form = document.getElementById("registrationForm");
  const payButton = document.getElementById("payButton");
  const message = document.getElementById("message");

  function showMessage(text, type) {
    message.textContent = text;
    message.className = type;
  }

  form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const workshopName =
      document.querySelector(".workshop-title").textContent.trim();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();

    if (!name || !email || !phone) {
      showMessage("Please fill in all required fields.", "error");
      return;
    }

    payButton.disabled = true;
    payButton.textContent = "Creating secure payment...";

    try {
      /*
        Backend endpoint required:
        POST /api/create-order
      */
      const orderResponse = await fetch("/api/create-order", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          amount: REGISTRATION_FEE_PAISE,
          currency: "INR",
          workshop_name: workshopName,
          name: name,
          email: email,
          phone: phone
        })
      });

      if (!orderResponse.ok) {
        throw new Error("Unable to create payment order.");
      }

      const order = await orderResponse.json();

      const options = {
        key: RAZORPAY_KEY_ID,
        amount: order.amount,
        currency: order.currency,
        name: workshopName,
        description: "Workshop Registration Fee",
        order_id: order.order_id,

        prefill: {
          name: name,
          email: email,
          contact: phone
        },

        notes: {
          workshop_name: workshopName
        },

        theme: {
          color: "#111111"
        },

        handler: async function(response) {
          payButton.textContent = "Verifying payment...";

          try {
            /*
              Backend endpoint required:
              POST /api/verify-payment
            */
            const verifyResponse = await fetch("/api/verify-payment", {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                razorpay_payment_id: response.razorpay_payment_id,
                razorpay_order_id: response.razorpay_order_id,
                razorpay_signature: response.razorpay_signature,

                registration: {
                  workshop_name: workshopName,
                  name: name,
                  email: email,
                  phone: phone
                }
              })
            });

            const result = await verifyResponse.json();

            if (!verifyResponse.ok || !result.success) {
              throw new Error("Payment verification failed.");
            }

            showMessage(
              "Registration successful! Payment ID: " +
              response.razorpay_payment_id,
              "success"
            );

            form.reset();

          } catch (error) {
            showMessage(
              "Payment was received, but verification could not be completed. Please contact the workshop organizer.",
              "error"
            );
          }

          payButton.disabled = false;
          payButton.textContent = "Pay ₹89 & Register";
        },

        modal: {
          ondismiss: function() {
            payButton.disabled = false;
            payButton.textContent = "Pay ₹89 & Register";
          }
        }
      };

      const razorpay = new Razorpay(options);

      razorpay.on("payment.failed", function(response) {
        const reason =
          response.error && response.error.description
            ? response.error.description
            : "Payment failed.";

        showMessage(reason, "error");

        payButton.disabled = false;
        payButton.textContent = "Pay ₹89 & Register";
      });

      razorpay.open();

    } catch (error) {
      console.error(error);

      showMessage(
        "Unable to start payment. Please try again.",
        "error"
      );

      payButton.disabled = false;
      payButton.textContent = "Pay ₹89 & Register";
    }
  });
</script>

</body>
</html>
