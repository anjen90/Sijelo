<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workshop Registration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef3ee;
    --ink: #17302a;
    --muted: #55695f;
    --card: #ffffff;
    --line: #cfdad2;
    --accent: #1f6f5c;
    --accent-dark: #164f42;
    --error: #b3261e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Karla", system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .wrap { width: 100%; max-width: 460px; }
  h1 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 800;
    font-size: clamp(2rem, 7vw, 2.6rem);
    line-height: 1.05;
    margin: 0 0 8px;
  }
  .sub { color: var(--muted); margin: 0 0 24px; line-height: 1.5; }
  form {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 24px;
  }
  .field { margin-bottom: 18px; }
  label { display: block; font-weight: 700; margin-bottom: 6px; font-size: .95rem; }
  label span { color: var(--error); }
  input {
    width: 100%;
    font: inherit;
    padding: 12px 14px;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
  }
  input:focus { outline: 3px solid #1f6f5c40; border-color: var(--accent); }
  input.invalid { border-color: var(--error); }
  .err { color: var(--error); font-size: .85rem; margin-top: 5px; min-height: 1em; }
  .fee {
    display: flex; justify-content: space-between; align-items: baseline;
    border-top: 1px dashed var(--line);
    padding-top: 16px; margin: 6px 0 18px;
  }
  .fee b { font-family: "Fraunces", Georgia, serif; font-size: 1.9rem; }
  button {
    width: 100%; font: inherit; font-weight: 700; font-size: 1.05rem;
    padding: 14px; border: 0; border-radius: 8px;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button:hover { background: var(--accent-dark); }
  button:focus-visible { outline: 3px solid #1f6f5c70; outline-offset: 2px; }
  button:disabled { opacity: .6; cursor: wait; }
  .note { text-align: center; color: var(--muted); font-size: .85rem; margin-top: 12px; }
  .status { margin-top: 16px; padding: 14px; border-radius: 8px; display: none; line-height: 1.45; }
  .status.ok { display: block; background: #e2f3ea; color: #14513d; }
  .status.fail { display: block; background: #fbe7e5; color: var(--error); }
</style>
</head>
<body>
<main class="wrap">
  <h1>Register for the workshop</h1>
  <p class="sub">Fill in your details, then pay securely with UPI, card or net banking.</p>

  <form id="regForm" novalidate>
    <div class="field">
      <label for="name">Full name <span>*</span></label>
      <input id="name" name="name" type="text" autocomplete="name" required>
      <div class="err" id="nameErr"></div>
    </div>
    <div class="field">
      <label for="email">Email <span>*</span></label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <div class="err" id="emailErr"></div>
    </div>
    <div class="field">
      <label for="phone">WhatsApp number <span>*</span></label>
      <input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="10" placeholder="10-digit mobile number" required>
      <div class="err" id="phoneErr"></div>
    </div>

    <div class="fee"><span>Registration fee</span><b>₹89</b></div>
    <button type="submit" id="payBtn">Pay ₹89 and register</button>
    <div class="note">Payments are processed by Razorpay.</div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </form>
</main>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
  const WORKSHOP_NAME = "Workshop Registration";
  // After deploying the backend on Vercel, paste its URL here (no trailing slash)
  const API_BASE = "https://YOUR-PROJECT.vercel.app";

  const form = document.getElementById("regForm");
  const btn = document.getElementById("payBtn");
  const statusEl = document.getElementById("status");

  function setError(id, msg) {
    document.getElementById(id + "Err").textContent = msg;
    document.getElementById(id).classList.toggle("invalid", !!msg);
  }

  function validate() {
    const name = form.name.value.trim();
    const email = form.email.value.trim();
    const phone = form.phone.value.replace(/\D/g, "");
    let ok = true;
    setError("name", name.length < 2 ? "Enter your full name." : ""); if (name.length < 2) ok = false;
    const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    setError("email", emailOk ? "" : "Enter a valid email address."); if (!emailOk) ok = false;
    const phoneOk = /^[6-9]\d{9}$/.test(phone);
    setError("phone", phoneOk ? "" : "Enter a valid 10-digit WhatsApp number."); if (!phoneOk) ok = false;
    return ok ? { name, email, phone } : null;
  }

  function show(type, msg) { statusEl.className = "status " + type; statusEl.textContent = msg; }

  const NO_SERVER = "Payment server not reachable. Check that API_BASE in this page points to your deployed backend.";

  async function api(url, options) {
    let r;
    try { r = await fetch(url, options); } catch (e) { throw new Error(NO_SERVER + " (network error)"); }
    const text = await r.text();
    let j;
    try { j = JSON.parse(text); } catch (e) {
      console.error("Non-JSON response from", url, r.status, text.slice(0, 500));
      throw new Error(NO_SERVER + " [HTTP " + r.status + " from " + url + ": " + text.replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim().slice(0, 120) + "]");
    }
    if (!r.ok) throw new Error(j.error || "Request failed (HTTP " + r.status + ")");
    return j;
  }

  function post(url, body) {
    return api(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  }

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    statusEl.className = "status";
    const data = validate();
    if (!data) return;
    if (typeof Razorpay === "undefined") { show("fail", "Payment service could not load. Check your connection and try again."); return; }

    btn.disabled = true;
    try {
      const order = await post(API_BASE + "/api/create-order", data);

      const rzp = new Razorpay({
        key: order.key_id,
        order_id: order.order_id,
        amount: order.amount,
        currency: order.currency,
        name: WORKSHOP_NAME,
        description: "Registration fee",
        prefill: { name: data.name, email: data.email, contact: "+91" + data.phone },
        theme: { color: "#1f6f5c" },
        handler: async function (resp) {
          try {
            await post(API_BASE + "/api/verify-payment", {
              razorpay_order_id: resp.razorpay_order_id,
              razorpay_payment_id: resp.razorpay_payment_id,
              razorpay_signature: resp.razorpay_signature
            });
            form.reset();
            show("ok", "You're registered, " + data.name + ". Payment ID: " + resp.razorpay_payment_id + ".");
          } catch (err) {
            show("fail", "Payment could not be verified: " + err.message + ". If money was deducted, contact the organiser with your payment ID " + resp.razorpay_payment_id + ".");
          }
          btn.disabled = false;
        },
        modal: { ondismiss: function () { btn.disabled = false; show("fail", "Payment cancelled. You can try again."); } }
      });
      rzp.on("payment.failed", function (r) {
        btn.disabled = false;
        show("fail", "Payment failed: " + (r.error && r.error.description ? r.error.description : "please try again."));
      });
      rzp.open();
    } catch (err) {
      btn.disabled = false;
      show("fail", err.message || "Something went wrong. Please try again.");
    }
  });
</script>
</body>
</html>
